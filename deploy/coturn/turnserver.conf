# VRemote coturn (TURN relay) — enables cross-internet / mobile WebRTC by relaying media
# when a direct P2P path can't be established (symmetric / carrier-grade NAT, e.g. phone on 4G).
#
# Credentials are time-limited via coturn's REST scheme and MUST match the backend
# TurnCredentialService: username = "<unix-expiry>:<deviceId>", password = base64(HMAC-SHA1(username, secret)).
# So `static-auth-secret` here MUST equal VREMOTE_TURN_SHARED_SECRET in the backend shared/.env.
#
# Install: apt-get install coturn; put this at /etc/turnserver.conf; set
#   TURNSERVER_ENABLED=1 in /etc/default/coturn; systemctl enable --now coturn.

# --- Listeners ---
listening-port=3478
# For turns:// (TLS) also open 5349 and point cert/pkey at your vremote.vplus.vn certs:
# tls-listening-port=5349
# cert=/etc/letsencrypt/live/vremote.vplus.vn/fullchain.pem
# pkey=/etc/letsencrypt/live/vremote.vplus.vn/privkey.pem

# --- Auth (REST / time-limited credentials) ---
use-auth-secret
static-auth-secret=CHANGE_ME__SAME_AS_VREMOTE_TURN_SHARED_SECRET
realm=vremote.vplus.vn

# --- Relay networking ---
# REQUIRED behind NAT/cloud: the server's PUBLIC IPv4 (relayed candidates use this).
external-ip=REPLACE_WITH_SERVER_PUBLIC_IP
# Bounded UDP relay range — OPEN THESE PORTS (udp) in the firewall/security group:
min-port=49152
max-port=65535

# --- Hardening ---
fingerprint
no-cli
stale-nonce=600
no-tlsv1
no-tlsv1_1
# Don't relay to loopback/private/meta ranges from clients:
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
