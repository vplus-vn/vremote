# VRemote production ingress — vremote.vplus.vn
# Install as /etc/nginx/sites-available/vremote.vplus.vn and symlink into sites-enabled.
# TLS certificates are provisioned outside this repository (certbot / managed).
#
# Serving model (matches the release layout in deploy/DEPLOY.md):
#   /                     -> static SPA (console build)   current/console/dist   (served by nginx)
#   /api/...              -> Laravel backend              127.0.0.1:8080         (internal nginx + PHP-FPM)
#   /signaling, /agent    -> signaling WebSocket service  127.0.0.1:8787
#   /downloads/...        -> signed Android APK           shared/downloads
#
# DEPLOY_ROOT must match DEPLOY_PATH in the deploy workflow. Default: /var/www/vremote.vplus.vn

upstream vremote_backend   { server 127.0.0.1:8080; }
upstream vremote_signaling { server 127.0.0.1:8787; }

# ---- Internal Laravel app server (not exposed publicly) ----
# Serves the backend build via PHP-FPM. The /api prefix is preserved end-to-end,
# so Laravel's routes/api.php (registered under /api) resolves normally.
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/vremote.vplus.vn/current/backend/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}

# ---- Public HTTPS ingress ----
server {
    listen 80;
    listen [::]:80;
    server_name vremote.vplus.vn;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` works on nginx 1.24 (Ubuntu 24.04) and 1.25+. The
    # standalone `http2 on;` directive requires nginx >= 1.25.1 and errors on 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vremote.vplus.vn;

    # ssl_certificate     /etc/letsencrypt/live/vremote.vplus.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vremote.vplus.vn/privkey.pem;

    client_max_body_size 10m;

    # Frontend (console SPA) served directly from the domain root.
    root /var/www/vremote.vplus.vn/current/console/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API under /api (prefix preserved to the internal app server).
    location /api/ {
        proxy_pass http://vremote_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Signaling / agent WebSocket (control plane only — no media/input).
    location /signaling {
        proxy_pass http://vremote_signaling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /agent {
        proxy_pass http://vremote_signaling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Signed Android agent APK (kept in shared/, survives releases).
    location /downloads/ {
        alias /var/www/vremote.vplus.vn/shared/downloads/;
        add_header Content-Disposition "attachment";
        types { application/vnd.android.package-archive apk; }
    }

    # Never expose the signaling internal port (127.0.0.1:8788) publicly.
}
