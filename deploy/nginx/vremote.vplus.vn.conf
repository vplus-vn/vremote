# VRemote production ingress
# Install as /etc/nginx/sites-available/vremote.vplus.vn and enable it.
# TLS certificates are intentionally provisioned outside this repository.

upstream vremote_backend { server 127.0.0.1:8080; }
upstream vremote_console { server 127.0.0.1:5173; }
upstream vremote_signaling { server 127.0.0.1:8787; }

server {
    listen 80;
    server_name vremote.vplus.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vremote.vplus.vn;

    # ssl_certificate /etc/letsencrypt/live/vremote.vplus.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vremote.vplus.vn/privkey.pem;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://vremote_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /signaling {
        proxy_pass http://vremote_signaling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /agent {
        proxy_pass http://vremote_signaling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://vremote_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Put the signed production APK here and keep it outside the source tree.
    location /downloads/ {
        alias /srv/vremote/downloads/;
        add_header Content-Disposition "attachment";
        types { application/vnd.android.package-archive apk; }
    }
}
