name: Test Signaling

on:
  push:
    paths:
      - 'signaling/**'
      - '.github/workflows/test-signaling.yml'
  pull_request:
    paths:
      - 'signaling/**'
      - '.github/workflows/test-signaling.yml'

jobs:
  build:
    runs-on: [self-hosted, node]
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
