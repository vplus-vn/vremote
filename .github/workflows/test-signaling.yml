name: Test Signaling

on:
  push:
    paths:
      - 'signaling/**'
      - '.github/workflows/test-signaling.yml'
  pull_request:
    paths:
      - 'signaling/**'
      - '.github/workflows/test-signaling.yml'

jobs:
  build:
    # [v0.1.1] Repo PUBLIC -> runner GitHub-hosted (mien phi cho repo public). Runner tu host cua org khong nhan
    # job repo public (job cho 24h roi bi huy tu 13/10) va KHONG duoc chay code PR cua repo public (2026-10-19).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test