name: Build Android Agent

# Standalone agent APK build — for fast iteration without a full production deploy,
# and to hand the APK to anyone from the Actions "Artifacts" section.
# Runs on demand from any branch, and automatically when the agent sources change.
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent-android/**'
      - '.github/workflows/build-agent.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Assemble agent APK (debug-signed, sideloadable)
        working-directory: agent-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Stage APK as vremote-agent.apk
        run: cp agent-android/app/build/outputs/apk/debug/app-debug.apk vremote-agent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vremote-agent-apk
          path: vremote-agent.apk
          if-no-files-found: error
