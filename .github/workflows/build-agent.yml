name: Build Android Agent

# Standalone agent APK build on the organization's self-hosted runner.
# Mirrors vborder-web CI: the runner is the server-side [self-hosted, node] runner,
# so Android builds do not consume GitHub-hosted Actions minutes.
# The APK is still uploaded as a GitHub Actions artifact for the existing download flow.
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent-android/**'
      - '.github/workflows/build-agent.yml'

jobs:
  build:
    runs-on: [self-hosted, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Skip the action's default `sdkmanager tools` — Google removed the obsolete `tools`
          # package, so the default install now fails ("Failed to find package 'tools'").
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Assemble agent APK (release-signed if keystore secret present, else debug)
        working-directory: agent-android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vremote-release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/vremote-release.jks"
            gradle :app:assembleRelease --no-daemon
            echo "AGENT_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "Built RELEASE-signed APK (stable signature -> in-app update works)."
          else
            gradle :app:assembleDebug --no-daemon
            echo "AGENT_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "No keystore secret -> DEBUG-signed APK (updates need reinstall)."
          fi
      - name: Stage APK as vremote-agent.apk
        run: cp "agent-android/${AGENT_APK}" vremote-agent.apk
      - name: Generate version manifest (vremote-agent.json)
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort | tail -n1)"
          BADGE="$("$AAPT" dump badging vremote-agent.apk)"
          VCODE="$(printf '%s\n' "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)"
          VNAME="$(printf '%s\n' "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          cp vremote-agent.apk "vremote_${VNAME}.apk"
          printf '{"versionCode": %s, "versionName": "%s", "url": "/downloads/vremote_%s.apk", "notes": ""}\n' "$VCODE" "$VNAME" "$VNAME" > vremote-agent.json
          cat vremote-agent.json
      - uses: actions/upload-artifact@v4
        with:
          name: vremote-agent-apk
          path: |
            vremote_*.apk
            vremote-agent.json
          if-no-files-found: error
