name: VRemote CI
# Runs on a SELF-HOSTED runner (org is on the Free plan; GitHub-hosted minutes are
# capped for private repos). Register a runner at
#   https://github.com/vplus-vn/vremote/settings/actions/runners
# on the vremote.vplus.vn server. Runner host prerequisites (the setup-* actions
# download PHP/Node/Java/Gradle themselves, but need a working base):
#   - Ubuntu/Debian x64 with sudo, git, curl, unzip and outbound internet
#   - `mongodb` PHP extension buildable (php-pear/phpize or apt) for the backend job
#   - the `android` job additionally needs the Android SDK (ANDROID_HOME +
#     cmdline-tools/platform/build-tools); GitHub-hosted images ship it, a bare
#     server does not — install it or that job will fail at assembleDebug.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  contract:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: test -s api/vremote/openapi.yaml && test -s api/vremote/asyncapi.yaml && test -s api/vremote/signing.md
  backend:
    runs-on: self-hosted
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb
      - name: Configure GitHub authentication for private Composer repositories
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: composer config --global github-oauth.github.com "$COMPOSER_TOKEN"
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan test
  console:
    runs-on: self-hosted
    defaults: { run: { working-directory: console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: console/package.json }
      - run: npm install
      - run: npm run build
  signaling:
    runs-on: self-hosted
    defaults: { run: { working-directory: signaling } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: signaling/package.json }
      - run: npm install
      - run: npm run build
      - run: npm test
  android:
    runs-on: self-hosted
    defaults: { run: { working-directory: agent-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload Android agent APK
        uses: actions/upload-artifact@v4
        with:
          name: vremote-agent-debug-apk
          path: agent-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
