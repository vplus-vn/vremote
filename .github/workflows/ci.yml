name: VRemote CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s api/vremote/openapi.yaml && test -s api/vremote/asyncapi.yaml && test -s api/vremote/signing.md
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb
      - name: Configure GitHub authentication for private Composer repositories
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSE_TOKEN }}
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          TOKEN="${COMPOSER_TOKEN}"
          if [ -z "$TOKEN" ]; then TOKEN="$GITHUB_ACTIONS_TOKEN"; fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan test
  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: console/package.json }
      - run: npm install
      - run: npm run build
  signaling:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: signaling } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: signaling/package.json }
      - run: npm install
      - run: npm run build
      - run: npm test
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
