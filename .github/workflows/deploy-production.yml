name: Deploy Production

# Automatic production deploy from main on the self-hosted [self-hosted, node] runner.
# Build and deploy are in the same workflow so the published APK always matches the commit.
# Manual dispatch remains available for re-deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ vars.SERVER_PROD_HOST || 'vremote.vplus.vn' }}
  DEPLOY_USER: ${{ vars.SERVER_PROD_USER || 'vdeploy' }}
  DEPLOY_PORT: ${{ vars.SERVER_PROD_PORT || '22022' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/vremote.vplus.vn' }}

jobs:
  build-agent:
    runs-on: [self-hosted, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Assemble agent APK
        working-directory: agent-android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vremote-release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/vremote-release.jks"
            gradle :app:assembleRelease --no-daemon
            echo "AGENT_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            gradle :app:assembleDebug --no-daemon
            echo "AGENT_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Stage APK
        run: cp "agent-android/${AGENT_APK}" vremote-agent.apk
      - name: Generate version manifest
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort | tail -n1)"
          BADGE="$("$AAPT" dump badging vremote-agent.apk)"
          VCODE="$(printf '%s\n' "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)"
          VNAME="$(printf '%s\n' "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          test -n "$VCODE" && test -n "$VNAME"
          cp vremote-agent.apk "vremote_${VNAME}.apk"
          printf '{"versionCode": %s, "versionName": "%s", "url": "/downloads/vremote_%s.apk", "notes": ""}\n' "$VCODE" "$VNAME" "$VNAME" > vremote-agent.json
          cat vremote-agent.json
      - uses: actions/upload-artifact@v4
        with:
          name: vremote-agent-apk
          path: |
            vremote_*.apk
            vremote-agent.json
          if-no-files-found: error

  deploy:
    needs: build-agent
    runs-on: [self-hosted, node]
    environment: production
    steps:
      - name: Fail fast if not on main
        run: test "${{ github.ref }}" = "refs/heads/main"
      - uses: actions/checkout@v4
      - name: Verify self-hosted PHP runtime
        working-directory: backend
        run: |
          set -euo pipefail
          php -v
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 ? 0 : 1);'
          php -m | grep -qi '^mongodb$'
          composer --version
      - name: Configure Composer auth
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: composer config --global github-oauth.github.com "$COMPOSER_TOKEN"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader \
            || composer update --no-interaction --prefer-dist --no-dev --optimize-autoloader
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build console
        working-directory: console
        run: |
          npm ci
          npm run build
      - name: Build signaling
        working-directory: signaling
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Download agent APK artifact from this release
        uses: actions/download-artifact@v4
        with:
          name: vremote-agent-apk
          path: agent-apk
      - name: Assemble release
        run: |
          set -euo pipefail
          REL="release"
          mkdir -p "$REL"
          rsync -a --delete --exclude '.git' --exclude '.env' --exclude 'tests' --exclude 'storage/logs/*' --exclude 'storage/framework/cache/*' backend/ "$REL/backend/"
          mkdir -p "$REL/console"
          cp -a console/dist "$REL/console/dist"
          mkdir -p "$REL/signaling"
          cp -a signaling/dist "$REL/signaling/dist"
          cp -a signaling/node_modules "$REL/signaling/node_modules"
          cp -a signaling/package.json "$REL/signaling/package.json"
          echo "${{ github.sha }}" > "$REL/REVISION"
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PROD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ secrets.SERVER_PROD_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SERVER_PROD_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
      - name: Upload release
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_TS=$TS" >> "$GITHUB_ENV"
          SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$TS' '$DEPLOY_PATH/shared/downloads' '$DEPLOY_PATH/shared/backend-storage'"
          rsync -az --delete -e "$SSH" release/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$TS/"
      - name: Publish agent APK
        run: |
          set -euo pipefail
          ls agent-apk/vremote_*.apk >/dev/null
          SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy"
          DL="$DEPLOY_PATH/shared/downloads"
          rsync -az -e "$SSH" agent-apk/vremote_*.apk "$DEPLOY_USER@$DEPLOY_HOST:$DL/"
          rsync -az -e "$SSH" agent-apk/vremote-agent.json "$DEPLOY_USER@$DEPLOY_HOST:$DL/vremote-agent.json"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$DL/vremote-agent.apk'; ls -1t '$DL'/vremote_*.apk 2>/dev/null | tail -n +6 | xargs -r rm -f"
      - name: Activate release
        run: |
          set -euo pipefail
          SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<EOF
          set -euo pipefail
          ROOT="$DEPLOY_PATH"
          TS="$RELEASE_TS"
          REL="\$ROOT/releases/\$TS"
          ln -sfn "\$ROOT/shared/.env" "\$REL/backend/.env"
          rm -rf "\$REL/backend/storage"
          ln -sfn "\$ROOT/shared/backend-storage" "\$REL/backend/storage"
          ln -sfn "\$ROOT/shared/downloads" "\$REL/console/dist/downloads" || true
          cd "\$REL/backend"
          php artisan migrate --force || true
          php artisan optimize:clear
          chmod -R 0777 bootstrap/cache
          php artisan package:discover --ansi || true
          ln -sfn "\$REL" "\$ROOT/current"
          sudo /usr/bin/systemctl restart vremote-signaling || echo "::warning::vremote-signaling not restarted"
          sudo /usr/bin/systemctl reload php8.3-fpm || sudo /usr/bin/systemctl restart php8.3-fpm || echo "::warning::php8.3-fpm not reloaded"
          sudo /usr/bin/systemctl reload nginx || echo "::warning::nginx not reloaded"
          cd "\$ROOT/releases" && ls -1dt */ | tail -n +6 | xargs -r rm -rf 2>/dev/null || true
          EOF
      - name: Smoke check
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEPLOY_HOST/api/vremote/health" || true)
          echo "GET https://$DEPLOY_HOST/api/vremote/health -> $code"
          test "$code" = "200"
