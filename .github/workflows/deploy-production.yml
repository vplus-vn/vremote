name: Deploy Production

# Manual-only deploy to vremote.vplus.vn from the main branch.
# Run it from the Actions tab: "Run workflow" -> branch: main -> confirm: deploy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deploy'
        required: true
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Non-secret deploy targets. Override via repo Variables if the server differs.
  DEPLOY_HOST: ${{ vars.SERVER_PROD_HOST || 'vremote.vplus.vn' }}
  DEPLOY_USER: ${{ vars.SERVER_PROD_USER || 'vdeploy' }}
  DEPLOY_PORT: ${{ vars.SERVER_PROD_PORT || '22022' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/vremote.vplus.vn' }}

jobs:
  # Build the Android agent APK in parallel with the deploy. Tolerant: if the Android
  # build fails (e.g. SDK hiccup), the deploy still ships backend/console/signaling and
  # simply leaves the previous APK in place, rather than blocking the whole release.
  build-agent:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Assemble agent APK (release-signed if keystore secret present, else debug)
        working-directory: agent-android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vremote-release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/vremote-release.jks"
            gradle :app:assembleRelease --no-daemon
            echo "AGENT_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "Built RELEASE-signed APK (stable signature -> in-app update works)."
          else
            gradle :app:assembleDebug --no-daemon
            echo "AGENT_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "No keystore secret -> DEBUG-signed APK (updates need reinstall)."
          fi
      - name: Stage APK as vremote-agent.apk
        run: cp "agent-android/${AGENT_APK}" vremote-agent.apk
      # Version manifest the in-app updater polls. Derived from the freshly built APK via aapt so
      # it can never drift from what actually shipped. Served statically at /downloads/vremote-agent.json.
      - name: Generate version manifest (vremote-agent.json)
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort | tail -n1)"
          BADGE="$("$AAPT" dump badging vremote-agent.apk)"
          VCODE="$(printf '%s\n' "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)"
          VNAME="$(printf '%s\n' "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          # Publish ONLY a version-stamped APK (vremote_<versionName>.apk) so every download is
          # distinguishable by version; the manifest + in-app updater point at it. vremote-agent.apk
          # is just a build-time working file (for aapt), not published.
          cp vremote-agent.apk "vremote_${VNAME}.apk"
          printf '{"versionCode": %s, "versionName": "%s", "url": "/downloads/vremote_%s.apk", "notes": ""}\n' "$VCODE" "$VNAME" "$VNAME" > vremote-agent.json
          cat vremote-agent.json
      - uses: actions/upload-artifact@v4
        with:
          name: vremote-agent-apk
          path: |
            vremote_*.apk
            vremote-agent.json
          if-no-files-found: error

  deploy:
    # Guard: only main, and only when the operator typed the confirmation word.
    # Runs even if build-agent failed (it is continue-on-error); a missing APK artifact
    # is handled best-effort in the "Publish agent APK" step below.
    needs: build-agent
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fail fast if not on main
        run: |
          test "${{ github.ref }}" = "refs/heads/main" || { echo "Deploy only from main"; exit 1; }

      - uses: actions/checkout@v4

      # ---- Build backend (PHP/Laravel) ----
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb
      - name: Configure Composer auth for private packages
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: composer config --global github-oauth.github.com "$COMPOSER_TOKEN"
      - name: Install backend dependencies (production)
        working-directory: backend
        # Self-healing: prefer the committed lock (reproducible). If it is stale or was
        # generated on a different PHP (the lock must satisfy this runner's PHP 8.3, and
        # composer.json pins platform.php=8.3.33), fall back to a fresh resolve so the
        # deploy is never blocked by a lock drift.
        run: |
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader \
            || composer update --no-interaction --prefer-dist --no-dev --optimize-autoloader

      # ---- Build console (static SPA) ----
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build console
        working-directory: console
        run: |
          npm ci
          npm run build

      # ---- Build signaling (Node service) ----
      - name: Build signaling
        working-directory: signaling
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      # ---- Pull the agent APK built by build-agent (best-effort) ----
      - name: Download agent APK artifact
        id: apk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vremote-agent-apk
          path: agent-apk

      # ---- Assemble the release directory ----
      - name: Assemble release
        run: |
          set -euo pipefail
          REL="release"
          mkdir -p "$REL"
          # Backend: ship the app + vendor, exclude local-only state (storage is shared).
          rsync -a --delete \
            --exclude '.git' --exclude '.env' --exclude 'tests' \
            --exclude 'storage/logs/*' --exclude 'storage/framework/cache/*' \
            backend/ "$REL/backend/"
          # Console: static build only.
          mkdir -p "$REL/console"
          cp -a console/dist "$REL/console/dist"
          # Signaling: built output + production node_modules + manifest.
          mkdir -p "$REL/signaling"
          cp -a signaling/dist "$REL/signaling/dist"
          cp -a signaling/node_modules "$REL/signaling/node_modules"
          cp -a signaling/package.json "$REL/signaling/package.json"
          echo "${{ github.sha }}" > "$REL/REVISION"

      # ---- SSH setup ----
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PROD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Trust the host key (pin via the SERVER_PROD_KNOWN_HOSTS secret when available).
          if [ -n "${{ secrets.SERVER_PROD_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SERVER_PROD_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      # ---- Upload the release to a new timestamped directory ----
      - name: Upload release
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_TS=$TS" >> "$GITHUB_ENV"
          SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$TS' '$DEPLOY_PATH/shared/downloads' '$DEPLOY_PATH/shared/backend-storage'"
          rsync -az --delete -e "$SSH" release/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$TS/"

      # ---- Publish the Android APK into shared/downloads (best-effort) ----
      # nginx serves /downloads/ from shared/downloads (survives releases). Only replaces
      # the live APK when build-agent produced one this run; otherwise leaves it untouched.
      - name: Publish agent APK
        run: |
          set -euo pipefail
          if ls agent-apk/vremote_*.apk >/dev/null 2>&1; then
            SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy"
            DL="$DEPLOY_PATH/shared/downloads"
            # Version-stamped APK is the ONLY published binary (distinguishable by version). The
            # manifest (fixed URL) is the stable pointer the in-app updater follows to the newest one.
            rsync -az -e "$SSH" agent-apk/vremote_*.apk "$DEPLOY_USER@$DEPLOY_HOST:$DL/"
            [ -f agent-apk/vremote-agent.json ] && rsync -az -e "$SSH" agent-apk/vremote-agent.json "$DEPLOY_USER@$DEPLOY_HOST:$DL/vremote-agent.json"
            # Retire the legacy stable permalink, then keep only the 5 newest version-stamped APKs.
            $SSH "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$DL/vremote-agent.apk'; ls -1t '$DL'/vremote_*.apk 2>/dev/null | tail -n +6 | xargs -r rm -f" || true
            echo "Published version-stamped APK (+ manifest); removed legacy vremote-agent.apk; pruned to 5 newest."
          else
            echo "No APK artifact this run (build-agent skipped/failed); keeping existing download."
          fi

      # ---- Activate the release on the server ----
      - name: Activate release
        run: |
          set -euo pipefail
          SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<EOF
          set -euo pipefail
          ROOT="$DEPLOY_PATH"
          TS="$RELEASE_TS"
          REL="\$ROOT/releases/\$TS"

          # Link shared, persistent state into the release.
          ln -sfn "\$ROOT/shared/.env"            "\$REL/backend/.env"
          rm -rf "\$REL/backend/storage"
          ln -sfn "\$ROOT/shared/backend-storage"  "\$REL/backend/storage"
          ln -sfn "\$ROOT/shared/downloads"        "\$REL/console/dist/downloads" || true

          cd "\$REL/backend"
          php artisan migrate --force || true
          php artisan optimize:clear
          # NOTE: config:cache is intentionally NOT run yet — request-path env() reads
          # (VPlus keys) must move to config first (DSG-VREMOTE-002 §4). Enable later.
          # php-fpm (www-data) writes the package manifest into this release's bootstrap/cache
          # on first request; the rsync'd dir is owned by the deploy user, so make it writable
          # by the fpm user and pre-warm it so the first web request only needs to read.
          chmod -R 0777 bootstrap/cache
          php artisan package:discover --ansi || true

          # Atomic flip.
          ln -sfn "\$REL" "\$ROOT/current"

          # Reload services (deploy user needs NOPASSWD sudo for exactly these).
          # Best-effort: the atomic flip above already makes the new release live, so a
          # missing signaling unit or not-yet-granted sudoers surfaces as a warning rather
          # than failing the whole deploy (see DEPLOY.md §6 for the one-time bootstrap).
          sudo /usr/bin/systemctl restart vremote-signaling || echo "::warning::vremote-signaling not restarted (unit installed? sudoers for $DEPLOY_USER? see DEPLOY.md §6)"
          sudo /usr/bin/systemctl reload php8.3-fpm || sudo /usr/bin/systemctl restart php8.3-fpm || echo "::warning::php8.3-fpm not reloaded (sudoers for $DEPLOY_USER?)"
          sudo /usr/bin/systemctl reload nginx || echo "::warning::nginx not reloaded (sudoers for $DEPLOY_USER?)"

          # Keep the last 5 releases. Best-effort: never fail the deploy on leftover
          # root-owned files from older manual releases the deploy user can't remove.
          cd "\$ROOT/releases" && ls -1dt */ | tail -n +6 | xargs -r rm -rf 2>/dev/null || true
          EOF

      - name: Smoke check
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEPLOY_HOST/api/vremote/health" || true)
          echo "GET https://$DEPLOY_HOST/api/vremote/health -> $code"
          test "$code" = "200" || { echo "Health check did not return 200"; exit 1; }
