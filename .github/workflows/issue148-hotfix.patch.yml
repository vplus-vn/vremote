name: Issue 148 hotfix patch

on:
  push:
    branches:
      - fix/issue-148-no-encoder-init

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('agent-android/app/src/main/java/vremote/vplus/vn/RemoteAgentService.kt')
          s=p.read_text()
          old='''        egl = EglBase.create()\n\n        val p = getSharedPreferences("vremote", MODE_PRIVATE)'''
          new='''        val p = getSharedPreferences("vremote", MODE_PRIVATE)'''
          if old not in s: raise SystemExit('egl block not found')
          s=s.replace(old,new,1)
          old='''        boot("factory build ${cfg()}")\n        // Decoder factory is retained for browser-side inbound negotiation, while the default MJPEG\n        // mode has no outgoing WebRTC video track and therefore never instantiates an encoder.\n        factory = PeerConnectionFactory.builder()\n            .setVideoEncoderFactory(SoftwareVideoEncoderFactory())\n            .setVideoDecoderFactory(DefaultVideoDecoderFactory(egl.eglBaseContext))\n            .createPeerConnectionFactory()\n        boot("factory ok")'''
          new='''        // RK3566 safety: MJPEG does not need WebRTC codec factories. The previous build still\n        // constructed SoftwareVideoEncoderFactory() here and could crash before MJPEG ran.\n        videoMode = "mjpeg"\n        boot("factory build ${cfg()} no-encoder")\n        factory = PeerConnectionFactory.builder()\n            .createPeerConnectionFactory()\n        boot("factory ok no-encoder")'''
          if old not in s: raise SystemExit('factory block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/issue148-hotfix.patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-android/app/src/main/java/vremote/vplus/vn/RemoteAgentService.kt .github/workflows/issue148-hotfix.patch.yml
          git commit -m 'fix: do not initialize WebRTC codecs for MJPEG'
          git push origin HEAD
