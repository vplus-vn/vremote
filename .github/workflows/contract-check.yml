name: VRemote Contract Check
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI and AsyncAPI YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('api/vremote/openapi.yaml'); YAML.load_file('api/vremote/asyncapi.yaml'); puts 'contract YAML valid'"
      - name: Verify contract files are present
        run: test -s api/vremote/openapi.yaml && test -s api/vremote/asyncapi.yaml && test -s api/vremote/signing.md
